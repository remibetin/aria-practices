[build]
# Applies to deploy previews, generated from pull requests.
ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- content/ test/ 'scripts/reference-tables.*' ':(exclude)content/landmarks/examples/'"
command = "bash build-netlify.sh"
publish = "wai-aria-practices/_site"

[build.environment]
RUBY_VERSION = "3.4.13"
